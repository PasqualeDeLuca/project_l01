<h1>Products</h1>

@if (products().length === 0) {
  <p>No products found.</p>
}

<p>Prodotti ricevuti: {{ products().length }}</p>

@for (product of products(); track product.id) {
  <article>
    <h2>{{ product.name }}</h2>

    <p>SKU: {{ product.sku }}</p>

    <p>Price: €{{ product.price }}</p>

    <p>Stock: {{ product.stockQuantity }}</p>
  </article>
}
